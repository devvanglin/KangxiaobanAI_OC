<!DOCTYPE html>
<!--
  语音评估表情舞台（宿主封装）
  表情引擎: Grok Ball (https://github.com/tycoding/grok-ball) —— MIT 许可，
  引擎源码随本目录分发（grok-ball.js + LICENSE）。本文件仅做脚本装载与桥接。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #mate {
      width: min(78vmin, 400px);
      height: min(78vmin, 400px);
    }
  </style>
</head>
<body>
  <div id="stage"><div id="mate"></div></div>
  <script src="grok-ball.js"></script>
  <script>
    // idle 由宿主显式驱动；评估会话期间表情完全跟随评估阶段。
    var ball = GrokBall.create(document.getElementById('mate'), { emotion: '02' });
    window.stage = {
      /** 与评估页约定桥接：按表情 ID 切换（00-49 契约，未知 ID 自动回退）。 */
      setEmotion: function (id) {
        ball.setEmotion(String(id));
      }
    };
  </script>
</body>
</html>
