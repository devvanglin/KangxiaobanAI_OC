<!DOCTYPE html>
<!--
  语音评估表情舞台（宿主封装）
  表情引擎: Mood Mates (https://github.com/sam70361/aora-bot) 云宝 Nimbo 角色。
  引擎源码与角色数据随本目录分发，许可见同目录 LICENSE（社区许可：非商业用途；
  商业授权需联系版权所有者）。本文件仅做脚本装载与桥接，未修改引擎本体。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    #stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
    }
    #mate {
      width: min(78vmin, 400px);
      height: min(78vmin, 400px);
    }
  </style>
</head>
<body>
  <div id="stage"><div id="mate"></div></div>
  <script src="core/geometry.js"></script>
  <script src="core/render.js"></script>
  <script src="core/features.js"></script>
  <script src="core/fx.js"></script>
  <script src="data/emotions.js"></script>
  <script src="core/engine.js"></script>
  <script src="characters/nimbo.js"></script>
  <script>
    // idle:false —— 评估会话期间表情完全由宿主按阶段驱动，不自动休眠。
    var mate = MoodMates.create(document.getElementById('mate'), {
      character: 'nimbo',
      emotion: '02',
      idle: false,
      autostart: true
    });
    window.stage = {
      /** 按 AI 协议切换表情；未知 ID 引擎会自动回退待机，不会白屏。 */
      setEmotion: function (id, tips) {
        mate.handleAIMessage(JSON.stringify({ emotionId: String(id), tips: tips || '' }));
      }
    };
  </script>
</body>
</html>
