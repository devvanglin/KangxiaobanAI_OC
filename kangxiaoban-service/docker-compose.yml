services:
  kangxiaoban-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: kangxiaoban-service:latest
    container_name: kangxiaoban-service
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      GIN_MODE: "release"
      KXB_SERVER_PORT: "8080"
      KXB_APP_VERSION: "${KXB_APP_VERSION:-1.0.0}"
      # 部署模式展示：服务器 .env 设 KXB_DEPLOY_MODE=demo 即显示"演示模式"；
      # 版本号由构建时注入二进制，需覆盖时在这里加 KXB_APP_VERSION。
      KXB_DEPLOY_MODE: "${KXB_DEPLOY_MODE:-production}"
      KXB_DB_DRIVER: "sqlite"
      KXB_DB_SQLITE_PATH: "/data/kangxiaoban.db"
      # Keep private admission photos beside the persistent database volume;
      # they are served only through authenticated API handlers.
      KXB_UPLOAD_DIR: "/data/uploads"
      KXB_JWT_SECRET: "${KXB_JWT_SECRET:?set KXB_JWT_SECRET in .env}"
      KXB_AI_CONFIG_KEY: "${KXB_AI_CONFIG_KEY:?set KXB_AI_CONFIG_KEY in .env}"
      KXB_JWT_EXPIRE: "86400"
      KXB_MQTT_ENABLE: "${KXB_MQTT_ENABLE:-true}"
      KXB_MQTT_URL: "${KXB_MQTT_URL:-tcp://10.10.1.14:1883}"
      KXB_MQTT_CLIENT_ID: "${KXB_MQTT_CLIENT_ID:-kxb-backend}"
      KXB_MQTT_USERNAME: "${KXB_MQTT_USERNAME:-}"
      KXB_MQTT_PASSWORD: "${KXB_MQTT_PASSWORD:-}"
      KXB_AI_ENABLED: "true"
      KXB_AI_PROVIDER: "local"
      # 空库首启写入一套互相关联的业务初始数据；已有正式数据时可设为 false。
      # 真实部署不写入演示设备、告警和健康数据；开发演示环境可在 .env 中显式改为 true。
      KXB_SEED_BUSINESS: "${KXB_SEED_BUSINESS:-false}"
    volumes:
      - ./data:/data
