services:
  kangxiaoban-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: kangxiaoban-service:latest
    container_name: kangxiaoban-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KXB_SERVER_PORT: "8080"
      KXB_DB_DRIVER: "sqlite"
      KXB_DB_SQLITE_PATH: "/data/kangxiaoban.db"
      KXB_JWT_SECRET: "${KXB_JWT_SECRET:?set KXB_JWT_SECRET in .env}"
      KXB_JWT_EXPIRE: "86400"
      KXB_MQTT_ENABLE: "false"
      KXB_AI_ENABLED: "true"
      KXB_AI_PROVIDER: "local"
      KXB_SEED_DEMO: "false"
    volumes:
      - ./data:/data
