services:
  kangxiaoban-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: kangxiaoban-service:latest
    container_name: kangxiaoban-service
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      GIN_MODE: "release"
      KXB_SERVER_PORT: "8080"
      KXB_APP_VERSION: "${KXB_APP_VERSION:-1.0.0}"
      # 部署模式展示：服务器 .env 设 KXB_DEPLOY_MODE=demo 即显示"演示模式"；
      # 版本号由构建时注入二进制，需覆盖时在这里加 KXB_APP_VERSION。
      KXB_DEPLOY_MODE: "${KXB_DEPLOY_MODE:-production}"
      KXB_DB_DRIVER: "sqlite"
      KXB_DB_SQLITE_PATH: "/data/kangxiaoban.db"
      # Keep private admission photos beside the persistent database volume;
      # they are served only through authenticated API handlers.
      KXB_UPLOAD_DIR: "/data/uploads"
      KXB_JWT_SECRET: "${KXB_JWT_SECRET:?set KXB_JWT_SECRET in .env}"
      KXB_AI_CONFIG_KEY: "${KXB_AI_CONFIG_KEY:?set KXB_AI_CONFIG_KEY in .env}"
      KXB_JWT_EXPIRE: "86400"
      KXB_MQTT_ENABLE: "${KXB_MQTT_ENABLE:-true}"
      KXB_MQTT_URL: "${KXB_MQTT_URL:-tcp://10.10.1.14:1883}"
      KXB_MQTT_CLIENT_ID: "${KXB_MQTT_CLIENT_ID:-kxb-backend}"
      KXB_MQTT_USERNAME: "${KXB_MQTT_USERNAME:-}"
      KXB_MQTT_PASSWORD: "${KXB_MQTT_PASSWORD:-}"
      # 模型服务（NewAPI/vLLM）与 Dify RAG 连接改由服务器 .env 配置，
      # 密钥不进镜像不进代码；留空时网关处于本地 provider / 未配置状态。
      KXB_AI_ENABLED: "${KXB_AI_ENABLED:-true}"
      KXB_AI_PROVIDER: "${KXB_AI_PROVIDER:-local}"
      KXB_AI_BASE_URL: "${KXB_AI_BASE_URL:-}"
      KXB_AI_MODEL: "${KXB_AI_MODEL:-}"
      KXB_AI_API_KEY: "${KXB_AI_API_KEY:-}"
      KXB_DIFY_BASE_URL: "${KXB_DIFY_BASE_URL:-}"
      KXB_DIFY_DATASET_ID: "${KXB_DIFY_DATASET_ID:-}"
      KXB_DIFY_API_KEY: "${KXB_DIFY_API_KEY:-}"
      # Authenticated proxy to the isolated AsLive assessment runtime.
      KXB_ASSESSMENT_AGENT_WS_URL: "${KXB_ASSESSMENT_AGENT_WS_URL:-ws://10.10.1.11:8000/assessment-ws}"
      KXB_ASSESSMENT_AGENT_TOKEN: "${KXB_ASSESSMENT_AGENT_TOKEN:?set KXB_ASSESSMENT_AGENT_TOKEN in .env}"
      # Model-directed shell/file tools execute only in OpenSandbox containers.
      KXB_SANDBOX_ENABLED: "${KXB_SANDBOX_ENABLED:-false}"
      KXB_SANDBOX_DOMAIN: "${KXB_SANDBOX_DOMAIN:-10.10.1.12:18081}"
      KXB_SANDBOX_PROTOCOL: "${KXB_SANDBOX_PROTOCOL:-http}"
      KXB_SANDBOX_API_KEY: "${KXB_SANDBOX_API_KEY:-}"
      KXB_SANDBOX_IMAGE: "${KXB_SANDBOX_IMAGE:-python:3.12-slim}"
      # 空库首启写入一套互相关联的业务初始数据；已有正式数据时可设为 false。
      # 真实部署不写入演示设备、告警和健康数据；开发演示环境可在 .env 中显式改为 true。
      KXB_SEED_BUSINESS: "${KXB_SEED_BUSINESS:-false}"
      # MinIO/S3 对象存储（管理端「存储」预览）。密钥只放服务器 .env，不进镜像不进代码。
      KXB_MINIO_ENDPOINT: "${KXB_MINIO_ENDPOINT:-}"
      KXB_MINIO_ACCESS_KEY: "${KXB_MINIO_ACCESS_KEY:-}"
      KXB_MINIO_SECRET_KEY: "${KXB_MINIO_SECRET_KEY:-}"
      KXB_MINIO_SECURE: "${KXB_MINIO_SECURE:-false}"
      KXB_MINIO_REGION: "${KXB_MINIO_REGION:-}"
    volumes:
      - ./data:/data
