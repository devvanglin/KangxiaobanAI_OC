<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智慧养老系统数据大屏</title>
<style>
.dashboard{margin-top:12px}.top-grid,.lower-grid{display:grid;grid-template-columns:1.15fr 1.15fr .76fr;gap:12px}.lower-grid{margin-top:12px;grid-template-rows:62px minmax(360px,1fr)}.left-stack{display:contents}.top-grid .overview{grid-column:1}.top-grid .status{grid-column:2}.top-grid .habits{grid-column:3}.lower-grid .filters{grid-column:1;grid-row:1}.lower-grid .table-panel{grid-column:1;grid-row:2}.lower-grid .severity{grid-column:2;grid-row:1 / span 2}.lower-grid .disease{grid-column:2;grid-row:3}.lower-grid>.chart-panel:last-child{grid-column:3;grid-row:1 / span 3}
:root{--bg:#f3f5f7;--panel:#fff;--line:#e8edf2;--ink:#17212b;--muted:#7a858f;--blue:#4aa8ee;--blue2:#9bcafa;--green:#5bb38a;--amber:#f5b94d;--sand:#f8dca5;--deep:#5c7fa4}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}
.screen{padding:12px;min-height:100vh}.top{height:76px;padding:0 38px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(100deg,#e5f3ff,#cfe7fb 55%,#e5f3ff);border:1px solid #dcecf8}.top h1{font-size:34px;letter-spacing:.06em;font-weight:600;color:#155a9b;margin:0}.top .time{position:absolute;right:28px;color:#1f609d;font-size:16px;font-weight:500}.top .mark{position:absolute;left:56px;display:grid;place-items:center;width:52px;height:52px;border-radius:17px;background:#4aa8ee;color:#fff;font-size:25px}.layout{display:grid;grid-template-columns:1.15fr 1.15fr .76fr;grid-template-rows:auto 1fr 1fr;gap:12px;margin-top:12px}.panel{background:var(--panel);border:1px solid var(--line);min-width:0;overflow:hidden}.panel h2{margin:0;padding:26px 18px 12px;font-size:21px;font-weight:500}.overview{grid-column:1;grid-row:1}.status{grid-column:2;grid-row:1}..habits{grid-column:3;grid-row:1}..metrics{display:grid;grid-template-columns:repeat(3,1fr);padding:15px 14px 25px;gap:8px}.metric{padding:10px 16px;border-left:1px solid var(--line)}.metric:first-child{border-left:0}.metric label{display:block;color:var(--muted);font-size:16px}.metric b{display:block;margin-top:9px;font-size:30px;line-height:1;font-weight:500;color:#3d4d59}.filters{grid-column:1;grid-row:2;display:flex;align-items:center;gap:18px;padding:14px 28px;background:#fff}.filters label{font-size:14px}.filters select{height:38px;min-width:200px;padding:0 12px;border:1px solid #d7e0e8;border-radius:5px;background:#fff;color:#9aa4ad;font-size:14px}.table-panel{grid-column:1;grid-row:3;min-height:360px}.table-wrap{padding:0 16px 14px;height:calc(100% - 62px);overflow:auto}.table-wrap table{width:100%;border-collapse:collapse;font-size:14px}.table-wrap th{background:#5aa9eb;color:white;font-weight:500;padding:10px 8px;white-space:nowrap}.table-wrap td{padding:9px 8px;text-align:center;border-bottom:1px solid #edf0f3;white-space:nowrap}.table-wrap tr:nth-child(even){background:#f7f8fa}.chart-panel{padding-bottom:16px}.severity{grid-column:2;grid-row:2}.disease{grid-column:2;grid-row:3}.chart{padding:10px 28px 25px}.bars{height:220px;display:flex;align-items:flex-end;gap:22px;border-bottom:1px solid #dfe5ea;background:repeating-linear-gradient(to top,transparent 0,transparent 43px,#e8edf2 44px)}.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}.bar{width:34px;background:linear-gradient(var(--blue),#76c8a0);border-radius:2px 2px 0 0;min-height:3px}.bar-col:nth-child(2) .bar{background:var(--blue)}.bar-col:nth-child(3) .bar{background:#9ed5bd}.bar-col:nth-child(4) .bar{background:#acd3f7}.bar-col:nth-child(5) .bar{background:var(--amber)}.bar-col:nth-child(6) .bar{background:var(--sand)}.bar-col span{font-size:13px;color:var(--muted)}.legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}.legend i{display:inline-block;width:9px;height:9px;margin-right:5px}.donuts{display:grid;grid-template-columns:1fr;gap:30px;padding:12px 24px 30px}.donut-row{display:flex;align-items:center;justify-content:center;gap:18px}.donut{width:126px;height:126px;border-radius:50%;background:conic-gradient(var(--amber) 0 25%,var(--sand) 25% 52%,var(--blue) 52% 78%,var(--blue2) 78% 100%);position:relative}.donut:after{content:"";position:absolute;inset:29px;border-radius:50%;background:#fff}.donut-label{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:13px}.donut-label span:before{content:"";display:inline-block;width:9px;height:9px;margin-right:6px;background:var(--blue);}.donut-label span:nth-child(2):before{background:var(--blue2)}.donut-label span:nth-child(3):before{background:var(--amber)}.donut-label span:nth-child(4):before{background:var(--sand)}
.habits{grid-column:3;grid-row:1}.metrics{display:grid;grid-template-columns:repeat(3,1fr);padding:15px 14px 25px;gap:8px}.filters{align-self:start;height:62px;padding:10px 28px}
@media(max-width:1100px){.top-grid,.lower-grid{grid-template-columns:1fr 1fr}.top-grid .overview,.top-grid .status,.top-grid .habits,.lower-grid .filters,.lower-grid .table-panel,.lower-grid .severity,.lower-grid .disease,.lower-grid>.chart-panel:last-child{grid-column:auto;grid-row:auto}.top-grid .habits,.lower-grid>.chart-panel:last-child{grid-column:1 / -1}.lower-grid{grid-template-rows:none}.top h1{font-size:28px}.top .mark{left:24px}.top .time{font-size:13px;right:18px}}
@media(max-width:680px){.screen{padding:6px}.top{height:64px;padding:0 10px}.top h1{font-size:20px}.top .mark{display:none}.top .time{font-size:11px}.top-grid,.lower-grid{display:flex;flex-direction:column}.metrics{padding-bottom:20px}.metric{padding:8px}.metric label{font-size:13px}.metric b{font-size:24px}.filters{flex-wrap:wrap;padding:16px}.filters select{flex:1;min-width:130px}.table-panel{min-height:350px}.donut{width:108px;height:108px}}
</style>
</head>
<body><div class="screen"><header class="top"><div class="mark">康</div><h1>智慧养老系统数据大屏</h1><div class="time" id="clock">--</div></header>
<main class="dashboard">
<div class="top-grid">
<section class="panel overview"><h2>老年用户概况</h2><div class="metrics"><div class="metric"><label>总用户数</label><b id="totalElders">—</b></div><div class="metric"><label>男性用户数</label><b id="maleElders">—</b></div><div class="metric"><label>女性用户数</label><b id="femaleElders">—</b></div></div></section>
<section class="panel status"><h2>用户患病情况</h2><div class="metrics"><div class="metric"><label>患病用户数</label><b id="alertElders">—</b></div><div class="metric"><label>健康用户数</label><b id="healthyElders">—</b></div><div class="metric"><label>重度照护用户数</label><b id="care5">—</b></div></div></section>
<section class="panel habits"><h2>重点生活习惯</h2><div class="metrics"><div class="metric"><label>在线设备</label><b id="onlineDevices">—</b></div><div class="metric"><label>待处理事项</label><b id="openTasks">—</b></div></div></section>
</div>
<div class="lower-grid"><div class="left-stack">
<section class="panel filters"><label>长者</label><select id="elderFilter"><option>请选择长者</option></select><label>照护等级</label><select id="levelFilter"><option>请选择等级</option><option>1级照护</option><option>2级照护</option><option>3级照护</option><option>4级照护</option><option>5级照护</option></select></section>
<section class="panel table-panel"><h2>用户健康状况详请</h2><div class="table-wrap"><table><thead><tr><th>用户ID</th><th>姓名</th><th>性别</th><th>照护等级</th><th>在线设备</th><th>状态</th></tr></thead><tbody id="elderRows"><tr><td colspan="6">加载中</td></tr></tbody></table></div></section>
<section class="panel chart-panel severity"><h2>照护等级分布</h2><div class="chart"><div class="bars" id="levelBars"></div><div class="legend" id="levelLegend"></div></div></section>
<section class="panel chart-panel disease"><h2>年龄分布</h2><div class="chart"><div class="bars" id="ageBars"></div><div class="legend"><span>长者人数</span></div></div></section>
<section class="panel chart-panel"><h2>设备与事项状态</h2><div class="donuts"><div class="donut-row"><div class="donut" id="deviceDonut"></div><div class="donut-label"><span>在线设备</span><span>离线设备</span></div></div><div class="donut-row"><div class="donut" id="taskDonut"></div><div class="donut-label"><span>待处理事项</span><span>其余事项</span></div></div></div></section>
</div></div></main></div>
<script>
const $=id=>document.getElementById(id);const api='/api/v1/public/dashboard';
function clock(){const d=new Date(),p=n=>String(n).padStart(2,'0');$('clock').textContent=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}setInterval(clock,1000);clock();
function fitTable(){const f=document.querySelector('.filters'),t=document.querySelector('.table-panel');if(!f||!t||innerWidth<681)return;const gap=t.getBoundingClientRect().top-f.getBoundingClientRect().bottom;if(gap>4){t.style.transform=`translateY(${-gap}px)`;t.style.marginBottom=`${-gap}px`;}}
addEventListener('load',()=>setTimeout(fitTable,30));addEventListener('resize',()=>setTimeout(fitTable,30));
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function drawBars(target,data,colors){const max=Math.max(1,...Object.values(data));$(target).innerHTML=Object.entries(data).map(([k,v],i)=>`<div class="bar-col"><b>${v}</b><div class="bar" style="height:${Math.max(3,v/max*180)}px;background:${colors[i%colors.length]}"></div><span>${esc(k)}</span></div>`).join('');}
function setDonut(id,part){const safe=Math.max(0,Math.min(100,Number(part)||0));$(id).style.background=`conic-gradient(var(--blue) 0 ${safe}%,var(--blue2) ${safe}% 100%)`;}
async function load(){try{const r=await fetch(api).then(x=>x.json());if(r.code!==0)return;const d=r.data||{},e=d.elders||{},g=d.gender||{},levels=d.care_levels||{},ages=d.age_buckets||{};const total=Number(e.in_bed||0),male=Number(g['男']||0),female=Number(g['女']||0),online=Number(d.devices?.online||0),deviceTotal=Number(d.devices?.total||0),todo=Number(d.tasks?.todo||0);$('totalElders').textContent=total;$('maleElders').textContent=male;$('femaleElders').textContent=female;$('onlineDevices').textContent=`${online}/${deviceTotal}`;$('openTasks').textContent=todo;$('alertElders').textContent=d.alerts?.emergency||0;$('healthyElders').textContent=Math.max(0,total-Number(d.alerts?.emergency||0));$('care5').textContent=levels['5级照护']||0;setDonut('deviceDonut',deviceTotal?online/deviceTotal*100:0);setDonut('taskDonut',todo?Math.min(100,todo/Math.max(todo,total)*100):0);drawBars('levelBars',levels,['#5bb38a','#8fc9a9','#acd3f7','#f5b94d','#f8dca5']);drawBars('ageBars',ages,['#4aa8ee','#8fc9f7','#9ed5bd','#f5b94d','#f8dca5']);const rows=d.elder_rows||[];$('elderRows').innerHTML=rows.map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.name)}</td><td>${esc(x.gender||'—')}</td><td>${esc(x.care_level)}</td><td>—</td><td>在住</td></tr>`).join('')||'<tr><td colspan="6">暂无长者数据</td></tr>';const sel=$('elderFilter');if(sel.options.length===1)rows.forEach(x=>{const o=document.createElement('option');o.textContent=x.name;o.value=x.id;sel.appendChild(o);});}catch(e){$('elderRows').innerHTML='<tr><td colspan="6">数据暂不可用</td></tr>';}}
load();setInterval(load,6000);
</script></body></html>
