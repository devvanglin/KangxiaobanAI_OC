<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康小伴 AI - 数据存储层关系图（MySQL + Redis + MinIO + RAG）</title>
<style>
  /* ============================================================
     可编辑说明：
     1. 修改文字：直接改 <text> 标签内容
     2. 修改颜色：改下方 CSS 变量
     3. 调整位置：改 <g> 的 transform="translate(x,y)"
     4. 增删节点：复制一组带 id 的 <g>
     ============================================================ */
  :root {
    --color-db:        #1890FF;   /* 主数据库 - 蓝 */
    --color-db-bg:     #E6F4FF;
    --color-redis:     #FF4D4F;   /* Redis - 红 */
    --color-redis-bg:  #FFF1F0;
    --color-minio:     #FA8C16;   /* MinIO - 橙 */
    --color-minio-bg:  #FFF7E6;
    --color-rag:       #722ED1;   /* RAG - 紫 */
    --color-rag-bg:    #F9F0FF;
    --color-backend:   #52C41A;   /* Go 后端 - 绿 */
    --color-backend-bg:#F6FFED;
    --color-text:      #1A1B1C;
    --color-text-sub:  #6B7280;
    --color-border:    #D9D9D9;
    --color-arrow:     #8C8C8C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    background: #FAFAFA;
    color: var(--color-text);
    padding: 24px;
  }
  .diagram-title {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 4px;
  }
  .diagram-subtitle {
    font-size: 13px;
    color: var(--color-text-sub);
    text-align: center;
    margin-bottom: 16px;
  }
  .svg-wrap {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid var(--color-border);
    padding: 16px;
    overflow-x: auto;
  }
  svg { display: block; width: 100%; height: auto; }
  .legend {
    max-width: 960px;
    margin: 16px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 12px;
    color: var(--color-text-sub);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
  .legend-line { display: inline-block; width: 24px; border-top: 2px solid #8C8C8C; }
  .legend-line-dashed { display: inline-block; width: 24px; border-top: 2px dashed #8C8C8C; }
</style>
</head>

<div class="diagram-title">康小伴 AI · 数据存储层关系图</div>
