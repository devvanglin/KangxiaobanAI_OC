<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康小伴 AI - 用户 / 后端 / 数据库 关系图</title>
<style>
  /* ============================================================
     可编辑说明：
     1. 修改文字：直接改 <text> 标签内容
     2. 修改颜色：改下方 CSS 变量或各 rect 的 fill
     3. 调整位置：改 <g> 的 transform="translate(x,y)"
     4. 增删节点：复制一组 <g class="node"> 即可
     ============================================================ */
  :root {
    --color-user:      #5B8FF9;   /* 用户层 - 蓝 */
    --color-user-bg:   #E8F0FE;
    --color-backend:   #52C41A;   /* 后端层 - 绿 */
    --color-backend-bg:#E6F7E6;
    --color-data:      #FA8C16;   /* 数据层 - 橙 */
    --color-data-bg:   #FFF3E6;
    --color-external:  #722ED1;   /* 外部服务 - 紫 */
    --color-ext-bg:    #F3E8FF;
    --color-text:      #1A1B1C;
    --color-text-sub:  #6B7280;
    --color-border:    #D9D9D9;
    --color-arrow:     #8C8C8C;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Arial, sans-serif;
    background: #FAFAFA;
    color: var(--color-text);
    padding: 24px;
  }
  .diagram-title {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 4px;
  }
  .diagram-subtitle {
    font-size: 13px;
    color: var(--color-text-sub);
    text-align: center;
    margin-bottom: 16px;
  }
  .svg-wrap {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid var(--color-border);
    padding: 16px;
    overflow-x: auto;
  }
  svg { display: block; width: 100%; height: auto; }
  .legend {
    max-width: 960px;
    margin: 16px auto 0;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 12px;
    color: var(--color-text-sub);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 3px; }
</style>
</head>
<body>

<div class="diagram-title">康小伴 AI · 用户 / 后端 / 数据库 关系图</div>
<div class="diagram-subtitle">基于 KangxiaobanAI 项目实际架构（HarmonyOS 客户端 → Go 后端 → SQLite/MySQL + 外部服务）</div>

<div class="svg-wrap">
<!-- ================================================================
     SVG 架构图
     viewBox: 0 0 920 680
     三层结构：用户层(上) → 后端层(中) → 数据/外部服务层(下)
     ================================================================ -->
<svg viewBox="0 0 920 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8C8C8C"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B8FF9"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52C41A"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FA8C16"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722ED1"/>
    </marker>
  </defs>

  <!-- ================================================================
       第一层：用户层 (y = 20 ~ 130)
       ================================================================ -->
  <g id="layer-user">
    <!-- 层标签 -->
    <rect x="20" y="20" width="880" height="110" rx="10"
          fill="#E8F0FE" stroke="#5B8FF9" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="36" y="44" font-size="13" font-weight="600" fill="#5B8FF9">用户层 · HarmonyOS NEXT 原生客户端</text>

    <!-- 护工端 -->
    <g id="node-caregiver" transform="translate(100, 58)">
      <rect width="180" height="56" rx="8" fill="#fff" stroke="#5B8FF9" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1B1C">护工端</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#6B7280">Caregiver · 日常照护工作台</text>
    </g>

    <!-- 医师端 -->
    <g id="node-doctor" transform="translate(370, 58)">
      <rect width="180" height="56" rx="8" fill="#fff" stroke="#5B8FF9" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1B1C">医师端</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#6B7280">Doctor · 评估 / 入住 / 健康管理</text>
    </g>

    <!-- 管理员端 -->
    <g id="node-admin" transform="translate(640, 58)">
      <rect width="180" height="56" rx="8" fill="#fff" stroke="#5B8FF9" stroke-width="1.5"/>
      <text x="90" y="26" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1B1C">管理员端</text>
      <text x="90" y="44" text-anchor="middle" font-size="11" fill="#6B7280">Admin · 机构运营 / 系统管理</text>
    </g>
  </g>

  <!-- ================================================================
       连接：用户层 → 后端层
       ================================================================ -->
  <g id="conn-user-to-backend">
    <!-- 三条线汇聚到后端入口 -->
    <line x1="190" y1="130" x2="190" y2="165" stroke="#5B8FF9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <line x1="460" y1="130" x2="460" y2="165" stroke="#5B8FF9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
    <line x1="730" y1="130" x2="730" y2="165" stroke="#5B8FF9" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

    <!-- 协议标注 -->
    <rect x="330" y="138" width="260" height="22" rx="11" fill="#fff" stroke="#5B8FF9" stroke-width="1"/>

      HTTPS REST + WebSocket（JWT 认证 · 租户隔离）
    </text>

  <!-- ================================================================

    <!-- 入口网关子层 -->

      </g>
      <g transform="translate(212, 28)">

      </g>
      <g transform="translate(310, 28)">
        <rect width="90" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>
        <text x="45" y="13" text-anchor="middle" font-size="10" fill="#1A1B1C">设备管理</text>
      </g>
      <g transform="translate(408, 28)">
        <rect width="90" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>
        <text x="45" y="13" text-anchor="middle" font-size="10" fill="#1A1B1C">告警事件</text>
      </g>
      <g transform="translate(506, 28)">
        <rect width="90" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>

      </g>
      <g transform="translate(604, 28)">
        <rect width="90" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>

      <g transform="translate(702, 28)">

      <!-- 业务模块 - 第二行 -->
      <g transform="translate(16, 50)">
        <rect width="120" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>

      </g>
      <g transform="translate(144, 50)">
        <rect width="120" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>
        <text x="60" y="13" text-anchor="middle" font-size="10" fill="#1A1B1C">语音评估 Agent</text>
      </g>
      <g transform="translate(272, 50)">
        <rect width="120" height="18" rx="4" fill="#F6FFED" stroke="#B7EB8F" stroke-width="0.8"/>

      <g transform="translate(400, 50)">

    </g>

    <!-- AI & 代理子层 -->
    <g id="backend-ai" transform="translate(40, 356)">
      <rect width="840" height="78" rx="8" fill="#fff" stroke="#52C41A" stroke-width="1" opacity="0.9"/>
      <text x="16" y="20" font-size="11" font-weight="600" fill="#52C41A">AI 网关 &amp; 外部代理</text>

      <!-- AI 网关 -->
      <g transform="translate(16, 30)">
        <rect width="240" height="40" rx="6" fill="#F9F0FF" stroke="#722ED1" stroke-width="1"/>
        <text x="120" y="18" text-anchor="middle" font-size="11.5" font-weight="600" fill="#722ED1">AI 对话网关</text>
        <text x="120" y="33" text-anchor="middle" font-size="10" fill="#6B7280">统一模型连接 · 角色提示词 · RAG · MCP · Skills</text>

      <!-- 语音评估代理 -->
      <g transform="translate(270, 30)">
        <rect width="240" height="40" rx="6" fill="#F9F0FF" stroke="#722ED1" stroke-width="1"/>
        <text x="120" y="18" text-anchor="middle" font-size="11.5" font-weight="600" fill="#722ED1">语音评估代理</text>

      <!-- 套餐推荐 -->
      <g transform="translate(524, 30)">
        <rect width="160" height="40" rx="6" fill="#F9F0FF" stroke="#722ED1" stroke-width="1"/>
        <text x="80" y="18" text-anchor="middle" font-size="11.5" font-weight="600" fill="#722ED1">套餐推荐</text>
        <text x="80" y="33" text-anchor="middle" font-size="10" fill="#6B7280">评估后异步生成照护计划</text>
      </g>

      <!-- OpenSandbox -->
      <g transform="translate(698, 30)">
        <rect width="126" height="40" rx="6" fill="#F9F0FF" stroke="#722ED1" stroke-width="1"/>
        <text x="63" y="18" text-anchor="middle" font-size="11.5" font-weight="600" fill="#722ED1">OpenSandbox</text>
        <text x="63" y="33" text-anchor="middle" font-size="10" fill="#6B7280">Agent 工具沙箱</text>
      </g>

  </g>

  <!-- ================================================================
       连接：后端层 → 数据层
       ================================================================ -->
  <g id="conn-backend-to-data">
    <!-- 主数据库连接 -->
    <line x1="300" y1="445" x2="300" y2="480" stroke="#FA8C16" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

    <!-- 外部服务连接 -->

  </g>

  <!-- ================================================================
       第三层：数据 & 外部服务层 (y = 485 ~ 660)
       ================================================================ -->

    <!-- 主数据库 -->
    <g id="node-database" transform="translate(20, 485)">
      <rect width="400" height="175" rx="10" fill="#FFF3E6" stroke="#FA8C16" stroke-width="1.5" stroke-dasharray="6,3"/>
